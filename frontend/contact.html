<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyNow Airlines | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="page-transition" class="transition-overlay">
        <div class="airplane-icon">✈️</div>
    </div>

    <nav class="navbar relative-nav">
        <div class="logo">FlyNow ✈️</div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="booking.html" class="nav-link">My Bookings</a></li>
            <li><a href="checkin.html" class="nav-link">Check-In</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
            <li id="auth-nav"><a href="login.html" class="nav-btn">Login/Register</a></li>
        </ul>
    </nav>

    <div class="container main-content justify-center align-center min-h-80vh">
        <div class="contact-box glassmorphism">
            <h2>Get in Touch</h2>
            <p>Have questions? We'd love to hear from you.</p>
            <form id="contact-form">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="contact-name" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="contact-email" required>
                </div>
                <div class="input-group">
                    <label>Message</label>
                    <textarea id="contact-message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-primary w-100">Send Message</button>
            </form>
            <div id="contact-alert"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FlyNow Airlines. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
