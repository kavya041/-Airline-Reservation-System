<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyNow Airlines | Login</title>
    <meta name="description" content="Login or Register for FlyNow Airlines.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="page-transition" class="transition-overlay">
        <div class="airplane-icon">✈️</div>
    </div>

    <div class="auth-page">
        <div class="auth-card glassmorphism">
            <div class="auth-logo">FlyNow ✈️</div>
            <h1 class="auth-title">Welcome Back</h1>

            <!-- Login Type Selector: User / Admin -->
            <div class="login-type-tabs">
                <button id="type-user" class="type-tab active" onclick="switchLoginType('user')">👤 User</button>
                <button id="type-admin" class="type-tab" onclick="switchLoginType('admin')">🛠️ Admin</button>
            </div>

            <!-- Action Tabs: Login / Register (only for User) -->
            <div class="auth-tabs" id="action-tabs">
                <button id="tab-login" class="tab-btn active">Login</button>
                <button id="tab-register" class="tab-btn">Register</button>
            </div>

            <div id="auth-message" class="auth-msg"></div>

            <!-- User Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary w-100">Login</button>
            </form>

            <!-- User Register Form -->
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="register-name" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Phone (optional)</label>
                    <input type="tel" id="register-phone" placeholder="+91 9876543210">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="register-password" placeholder="Min. 6 characters" required>
                </div>
                <button type="submit" class="btn-primary w-100">Create Account</button>
            </form>

            <!-- Admin Login Form (hidden by default) -->
            <form id="admin-login-form" class="auth-form">
                <div class="admin-badge">🔐 Admin Access Only</div>
                <div class="input-group">
                    <label>Admin Email</label>
                    <input type="email" id="admin-login-email" placeholder="admin@FlyNow.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="admin-login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-danger w-100">Login as Admin</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
